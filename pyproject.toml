[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stopwise"
version = "0.2.0"
description = "A lightweight metacognitive stopping and intervention policy for LLM conversations"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "StopWise contributors" }]
dependencies = ["pydantic>=2.7,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/stopwise/prompts" = [
  "prompts/analyzer_system.md",
  "prompts/custom_instruction.md",
  "prompts/custom_instruction_compact.md",
  "prompts/custom_instruction_current_snapshot.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
